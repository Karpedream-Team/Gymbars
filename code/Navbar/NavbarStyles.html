<style>

  .navbar {

    background-color: var(--color-navbar);
    color: #fff;
    transition: box-shadow 0.25s ease;
  }

  .navbar.is-scrolled {
    box-shadow: 0 2px 14px rgba(0, 0, 0, 0.35);
  }

  .navbar-inner {
    max-width: var(--container);
    height: var(--nav-height);
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .navbar-brand {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #fff;
    margin-right: auto;
  }

  .navbar-menu {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .navbar-links,

    display: flex;
    align-items: center;
    list-style: none;
    gap: 4px;
  }

  .navbar-social {
    margin-left: 12px;
    gap: 2px;
  }

  .navbar-link {
    display: inline-block;
    padding: 8px 12px;
    font-size: 15px;
    font-weight: 700;

  .navbar-link:hover,
  .navbar-link.is-active {
    color: #fff;
    background-color: rgba(255, 255, 255, 0.08);
  }

  .navbar-link--admin {
    color: #93C5FD !important;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(59, 130, 246, 0.12);
  }

  .navbar-link--admin:hover {
    color: #BFDBFE !important;
    background-color: rgba(59, 130, 246, 0.22) !important;
  }

  .navbar-social-link {
    display: inline-flex;
    align-items: center;

    width: 36px;
    height: 36px;

  .navbar-social-link:hover {

    background-color: rgba(255, 255, 255, 0.12);
  }

  .navbar-toggle {
    display: none;

    flex-direction: column;
    justify-content: space-between;
  }

  .navbar-toggle span {
    display: block;
    height: 2px;
    width: 100%;
    background: #fff;
    border-radius: 2px;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .navbar-toggle[aria-expanded="true"] span:nth-child(1) {

  }

  .navbar-toggle[aria-expanded="true"] span:nth-child(2) {
    opacity: 0;
  }

  .navbar-toggle[aria-expanded="true"] span:nth-child(3) {

  }

  @media (max-width: 860px) {

      display: flex;
    }

    .navbar-menu {

      right: 0;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      padding: 8px 16px 20px;
      background-color: var(--color-navbar);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      transform: translateY(-8px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    }

    .navbar-menu.is-open {
      transform: translateY(0);
      opacity: 1;
      visibility: visible;
    }

    .navbar-links {
      flex-direction: column;
      align-items: stretch;
    }

    .navbar-link {
      display: block;
      padding: 14px 12px;
      font-size: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .navbar-social {
      margin: 16px 0 0;
      justify-content: center;
      gap: 10px;
    }

    body.menu-open {
      overflow: hidden;
    }

</style>
