<style>
  /* ==================== HOME ==================== */

  .muted {
    color: rgba(33, 37, 41, 0.55);
    font-size: 15px;
  }

  /* ---------- Carrusel ---------- */

  .hero-carousel {
    position: relative;
    background: #000;
    overflow: hidden;
    height: clamp(300px, 56vw, 620px);
  }

  .hero-carousel-track {
    position: absolute;
    inset: 0;
  }

  .carousel-slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.6s ease, visibility 0.6s;
  }

  .carousel-slide.is-active {
    opacity: 1;
    visibility: visible;
  }

  .carousel-slide .media {
    width: 100%;
    height: 100%;
    background-color: #0b0b0b;
  }

  .carousel-slide .media--empty {
    background-image: linear-gradient(135deg, #14143f, #0b0b0b 65%);
  }

  .carousel-slide .media--empty::after {
    color: rgba(255, 255, 255, 0.28);
    letter-spacing: 6px;
    font-size: 14px;
  }

  .carousel-caption {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 60px 24px 24px;
    text-align: center;
    color: #fff;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0));
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .carousel-caption strong {
    font-size: 20px;
    font-weight: 500;
  }

  .carousel-caption span {
    font-size: 14px;
    opacity: 0.85;
  }

  .carousel-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #fff;
    background: rgba(0, 0, 0, 0.35);
    border-radius: 50%;
    transition: background-color 0.2s ease, opacity 0.2s ease;
  }

  .carousel-arrow:hover {
    background: rgba(0, 0, 0, 0.6);
  }

  .carousel-arrow--prev { left: 18px; }
  .carousel-arrow--next { right: 18px; }

  .carousel-dots {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 14px;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .carousel-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.45);
    transition: background-color 0.2s ease, transform 0.2s ease;
  }

  .carousel-dot.is-active {
    background: #fff;
    transform: scale(1.25);
  }

  /* ---------- Información / características ---------- */

  .features-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 40px;
    margin-top: 40px;
    align-items: start;
  }

  .feature-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .feature-media {
    width: 100%;
    aspect-ratio: 16 / 10;
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
  }

  .feature-title {
    font-size: 20px;
    font-weight: 500;
  }

  .feature-desc {
    font-size: 15px;
    color: rgba(33, 37, 41, 0.78);
    max-width: 320px;
  }

  /* ---------- Horario + contacto ---------- */

  .two-columns {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 40px;
    align-items: start;
  }

  .schedule {
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: var(--radius);
    overflow: hidden;
    background: #FDFDFE;
  }

  .schedule-group + .schedule-group {
    border-top: 1px solid rgba(0, 0, 0, 0.08);
  }

  .schedule-day {
    padding: 12px;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    color: var(--color-text-light);
  }

  .schedule-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 14px 12px;
    text-align: center;
    font-size: 16px;
    border-top: 1px solid rgba(0, 0, 0, 0.05);
    background: #fff;
  }

  .schedule-shift {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: rgba(33, 37, 41, 0.5);
  }

  .schedule-time {
    font-weight: 500;
  }

  .contact-card {
    background-color: var(--color-contact);
    color: #fff;
    border-radius: var(--radius);
    padding: 28px 24px;
    text-align: center;
  }

  .contact-block + .contact-block {
    margin-top: 24px;
  }

  .contact-heading {
    font-size: 26px;
    font-weight: 500;
    margin-bottom: 10px;
    color: #fff;
  }

  .contact-heading i {
    font-size: 20px;
    opacity: 0.85;
  }

  .contact-phone {
    font-size: 30px;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: #fff;
    transition: opacity 0.2s ease;
  }

  .contact-phone:hover {
    opacity: 0.8;
  }

  .contact-social {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }

  .contact-social a {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    color: #fff;
    opacity: 0.92;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .contact-social a:hover {
    opacity: 1;
    transform: translateY(-1px);
  }

  .contact-social i {
    width: 26px;
    text-align: center;
    font-size: 22px;
  }

  /* ---------- Programas ---------- */

  .programs-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 32px;
    margin-top: 40px;
    text-align: left;
  }

  .program-button {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--color-bg);
    border: 1px solid rgba(0, 0, 0, 0.07);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-card);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .program-button:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
  }

  .program-media {
    aspect-ratio: 4 / 3;
  }

  .program-title {
    font-size: 22px;
    font-weight: 500;
    padding: 16px 18px 4px;
  }

  .program-cta {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 18px 18px;
    font-size: 13px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--color-accent);
  }

  .program-cta i {
    font-size: 11px;
    transition: transform 0.2s ease;
  }

  .program-button:hover .program-cta i {
    transform: translateX(4px);
  }

  /* ---------- Ubicación ---------- */

  .address {
    margin-bottom: 28px;
  }

  .address-line {
    font-size: 16px;
    margin-bottom: 6px;
  }

  .address-line--muted {
    font-style: italic;
    color: rgba(33, 37, 41, 0.62);
  }

  .map-wrapper {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-card);
    background: var(--color-section);
  }

  .map-wrapper iframe {
    display: block;
    width: 100%;
    height: 400px;
    border: 0;
  }

  .map-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 500;
    background: var(--color-section);
    color: var(--color-text);
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 999px;
    transition: transform 0.2s ease, background-color 0.2s ease;
  }

  .map-link:hover {
    transform: translateY(-1px);
    background: #fff;
  }

  /* ---------- Responsive ---------- */

  @media (max-width: 980px) {
    .features-grid,
    .programs-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .features-grid {
      gap: 30px;
    }
  }

  @media (max-width: 820px) {
    .two-columns {
      grid-template-columns: 1fr;
      gap: 34px;
    }
  }

  @media (max-width: 640px) {
    .features-grid,
    .programs-grid {
      grid-template-columns: 1fr;
      gap: 26px;
    }

    .carousel-arrow {
      width: 38px;
      height: 38px;
      font-size: 15px;
    }

    .carousel-arrow--prev { left: 10px; }
    .carousel-arrow--next { right: 10px; }

    .contact-phone {
      font-size: 26px;
    }

    .map-wrapper iframe {
      height: 300px;
    }
  }
</style>
