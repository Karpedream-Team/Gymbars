<style>
  /* ==========================================================================
     GYMBARS — Estilos base
     Los colores se sobrescriben en tiempo de ejecución desde la pestaña "Sitio".
     ========================================================================== */

  :root {
    --color-navbar: #000000;
    --color-bg: #FFFFFF;
    --color-section: #F8F9FA;
    --color-text: #212529;
    --color-text-light: #F8F9FA;
    --color-accent: #0E0E53;
    --color-saturday: #323232;
    --color-sunday: #960000;
    --color-contact: #343A40;

    --font-base: 'Roboto', 'Helvetica Neue', sans-serif;

    --nav-height: 58px;
    --container: 1140px;
    --radius: 4px;
    --shadow-card: 0 2px 10px rgba(0, 0, 0, 0.06);
    --shadow-hover: 0 10px 28px rgba(0, 0, 0, 0.16);
  }

  *,
  *::before,
  *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
    scroll-padding-top: var(--nav-height);
  }

  body {
    font-family: var(--font-base);
    font-weight: 400;
    font-size: 16px;
    line-height: 1.5;
    color: var(--color-text);
    background-color: var(--color-bg);
    -webkit-font-smoothing: antialiased;
    padding-top: var(--nav-height);
    padding-top: calc(var(--nav-height) + env(safe-area-inset-top));
    overflow-x: hidden;
  }

  img {
    max-width: 100%;
    display: block;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  button {
    font: inherit;
    color: inherit;
    border: 0;
    background: none;
    cursor: pointer;
  }

  :focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 3px;
  }

  /* ==========================================================================
     LAYOUT
     ========================================================================== */

  .container {
    width: 100%;
    max-width: var(--container);
    margin: 0 auto;
    padding: 0 20px;
  }

  .section {
    padding: 50px 0;
    background-color: var(--color-bg);
  }

  .section--alt {
    background-color: var(--color-section);
  }

  .section--tight {
    padding: 25px 0;
  }

  .text-center {
    text-align: center;
  }

  /* Título de sección: h1 ligero + divisor corto (como el sitio original) */
  .section-title {
    font-size: 72px;
    font-weight: 300;
    line-height: 1.1;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    color: var(--color-text);
  }

  .section-divider {
    border: 0;
    border-top: 1px solid rgba(0, 0, 0, 0.1);
    width: min(620px, 90%);
    margin: 24px auto;
  }

  .section-lead {
    max-width: 760px;
    margin: 0 auto;
    font-size: 16px;
    color: rgba(33, 37, 41, 0.85);
  }

  .subsection-title {
    font-size: 32px;
    font-weight: 500;
    line-height: 1.2;
    margin-bottom: 18px;
  }

  /* ==========================================================================
     BOTONES
     ========================================================================== */

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 22px;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 500;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
  }

  .btn--primary {
    background: var(--color-accent);
    color: #fff;
  }

  .btn--light {
    background: #fff;
    color: var(--color-text);
    border: 1px solid rgba(0, 0, 0, 0.12);
  }

  /* ==========================================================================
     IMÁGENES / PLACEHOLDERS
     ========================================================================== */

  .media {
    position: relative;
    width: 100%;
    overflow: hidden;
    background-color: var(--color-section);
    background-image: linear-gradient(135deg, rgba(14, 14, 83, 0.10), rgba(14, 14, 83, 0.03));
    background-size: cover;
    background-repeat: no-repeat;
  }

  .media--empty::after {
    content: 'Gymbars';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(14, 14, 83, 0.35);
  }

  .media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .media-img--contain {
    object-fit: contain !important;
  }

  .media--empty .media-img {
    display: none;
  }

  /* ==========================================================================
     ANIMACIONES
     ========================================================================== */

  .fade-in {
    animation: fadeIn 0.4s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ==========================================================================
     RESPONSIVE
     ========================================================================== */

  @media (max-width: 720px) {
    .section {
      padding: 36px 0;
    }

    .section-title {
      font-size: 42px;
    }

    .subsection-title {
      font-size: 26px;
    }

    .section-divider {
      margin: 18px auto;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    html {
      scroll-behavior: auto;
    }

    *,
    *::before,
    *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
